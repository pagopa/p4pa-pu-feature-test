name: Publish scenario catalogue

# Builds a browsable catalogue of the Gherkin scenarios (from bdd/features)
# and publishes it to GitHub Pages using GitHub's own Pages deployment.
# It reads only the feature files: no test execution, no secrets.

on:
  push:
    # TODO: remove the test branch before merging — keep only main.
    branches: [ main, P4ADEV-4975-fix-github-action-for-scenario-docs ]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent Pages deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build scenario docs and publish to GitHub Pages
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install docs dependencies
        run: pip install behave mkdocs mkdocs-material

      - name: Generate scenario docs
        run: |
          python scenario_parser.py \
            --page-name "Piattaforma Unitaria Functional Testing" \
            --repo-name ${{ github.event.repository.name }} \
            --root-dir bdd/features

      - name: Build MkDocs site
        run: mkdocs build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Create/enable the Pages site (source = GitHub Actions) if it does
          # not exist yet, so the first run works without a manual setup.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
